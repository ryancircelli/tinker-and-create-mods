# Tinker & Create — ModernFix tuning
#
# Goal: keep the pack playable in a 4 GB client heap so friends on weak PCs can
# join. Without these, a 339-mod resource reload allocates one huge contiguous
# buffer while stitching the texture atlas and dies with:
#
#   OutOfMemoryError: Java heap space   (thread Worker-ResourceReload-N)
#   -> "Caught error loading resourcepacks, removing all selected resourcepacks"
#   -> "Tried to lookup sprite, but atlas is not initialized"  (cascade)
#
# Note the heap sat at only 40% AFTER that crash — it is an allocation spike
# during load, not a leak, which is why lazy loading fixes it and more RAM only
# hides it.
#
# Everything below is off by default in ModernFix; defaults already-on
# (faster_texture_stitching, model_optimizations, reduce_blockstate_cache_rebuilds)
# are left alone.

# The big one: bake block/item models on demand instead of holding every model
# for every mod in memory at once. This is what gets us under 4 GB.
# https://github.com/embeddedt/ModernFix/wiki/Dynamic-Resources-FAQ
mixin.perf.dynamic_resources=true

# Intern ResourceLocation strings. With ~300 mods there are a great many
# duplicate namespace/path strings; deduplicating them is pure heap savings.
mixin.perf.deduplicate_location=true

# Terralith + Geophilic register a lot of biomes, each carrying climate
# parameter objects that are mostly identical. Deduplicate them.
mixin.perf.deduplicate_climate_parameters=true
