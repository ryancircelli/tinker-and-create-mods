# Lithium is in 81/100 reference NeoForge 1.21.1 packs, so it belongs here -- but
# in THIS mod set its entity-collision optimisation dies at class-init:
#   ExceptionInInitializerError in WorldHelper.<clinit>
#   via LithiumEntityCollisions.doesBoxCollideWithHardEntities (Level.noCollision)
# Disable just that subsystem; every other Lithium optimisation stays on.
mixin.entity.collisions=false
