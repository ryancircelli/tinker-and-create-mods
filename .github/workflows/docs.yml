name: Docs are current

# Everything under docs/usage/ is derived from the pack -- the mod list from
# tools/mods.json plus the built .mrpack, the quest book from the Boundless
# questpack, the keybind table from the shipped keybindings.txt. The badges in
# README.md and modrinth-description.md are derived too.
#
# This workflow regenerates all of it and fails if the result differs from what
# was committed. That single check does two jobs:
#
#   1. Docs cannot go stale. The hand-written list this replaced advertised
#      Dramatic Doors weeks after it was removed and had never heard of half the
#      pack, on a README that is the project's front page.
#   2. Nobody can hand-edit a generated file and have it stick. The regeneration
#      overwrites the edit, so the diff fails the run and the contributor is
#      told which source file to change instead.
#
# Deliberately a CHECK, not a commit-back: a workflow that pushes to the branch
# it was triggered by needs write access on every pull request, including from
# forks, and re-triggers itself. Failing loudly is cheaper and safer.

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'overrides/**'
      - 'docs/**'
      - 'README.md'
      - 'modrinth-description.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'overrides/**'
      - 'docs/**'
      - 'README.md'
      - 'modrinth-description.md'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The mod list quotes exact jar versions, which only exist in a built
      # .mrpack, and packs/ is gitignored. Restoring the resolver cache keeps
      # this to a handful of API calls instead of ~380.
      - name: Restore resolver cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: modrinth-cache-${{ hashFiles('tools/mods.json') }}
          restore-keys: modrinth-cache-

      - name: Build the pack
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: node tools/build.js

      - name: Regenerate docs
        run: node tools/gen-docs.js

      - name: Fail if anything was out of date
        run: |
          if ! git diff --quiet -- docs/ README.md modrinth-description.md; then
            echo "::error::Generated docs are out of date. Run 'node tools/gen-docs.js' and commit the result."
            echo
            echo "Files that differ:"
            git diff --name-only -- docs/ README.md modrinth-description.md | sed 's/^/  /'
            echo
            echo "If you edited one of these by hand, edit its source instead:"
            echo "  docs/usage/mods.md        <- tools/mods.json"
            echo "  docs/usage/quest-book.md  <- tools/gen-quests-boundless.js"
            echo "  docs/usage/keybinds.md    <- tools/gen-keybinds.js"
            echo
            git --no-pager diff -- docs/ README.md modrinth-description.md
            exit 1
          fi
          echo "Docs match the pack."
