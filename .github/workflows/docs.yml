name: Docs are current

# Everything under docs/usage/ is derived from the pack -- the mod list from
# tools/mods.json plus the built .mrpack, the quest book from the Boundless
# questpack, the keybind table from the shipped keybindings.txt. The badges in
# README.md and modrinth-description.md are derived too.
#
# This workflow regenerates all of it and fails if the result differs from what
# was committed. That single check does two jobs:
#
#   1. Docs cannot go stale. The hand-written list this replaced advertised
#      Dramatic Doors weeks after it was removed and had never heard of half the
#      pack, on a README that is the project's front page.
#   2. Nobody can hand-edit a generated file and have it stick. The regeneration
#      overwrites the edit, so the diff fails the run and the contributor is
#      told which source file to change instead.
#
# This is a CHECK, not a commit-back. The authoritative regeneration happens in
# publish.yml, which runs after the build and commits the result -- CI owns the
# derived docs, because CI's build is the one that gets published.
#
# The split is deliberate:
#
#   publish.yml (master, after build)  regenerates everything, commits it
#   docs.yml    (pull requests)        only checks, never writes
#
# A pull request cannot be trusted with write access, and one from a fork cannot
# push at all, so a commit-back here would either fail or be a security hole.
# Failing loudly with the source file named is the useful behaviour for a PR.

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'overrides/**'
      - 'docs/**'
      - 'README.md'
      - 'modrinth-description.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'overrides/**'
      - 'docs/**'
      - 'README.md'
      - 'modrinth-description.md'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build step, deliberately. The checked docs are derived only from
      # files in the repository -- tools/mods.json, the questpack, the shipped
      # keybindings -- so this needs no network, no token, and no resolver
      # cache, and it gives the same answer every time.
      #
      # docs/usage/shipped-jars.md is the exception and is NOT checked: it
      # records the versions the resolver chose at build time, so it changes
      # whenever any of ~340 mods publishes upstream. The first run of this
      # workflow failed on exactly that (supplementaries 3.8.8 vs 3.8.9) with
      # nothing in the repository having changed. It is refreshed on build
      # instead.
      - name: Regenerate docs
        run: node tools/gen-docs.js

      - name: Fail if anything was out of date
        run: |
          if ! git diff --quiet -- docs/usage/mods.md docs/usage/quest-book.md \
                                   docs/usage/keybinds.md README.md modrinth-description.md; then
            echo "::error::Generated docs are out of date. Run 'node tools/gen-docs.js' and commit the result."
            echo
            echo "Files that differ:"
            git diff --name-only -- docs/usage/mods.md docs/usage/quest-book.md docs/usage/keybinds.md README.md modrinth-description.md | sed 's/^/  /'
            echo
            echo "If you edited one of these by hand, edit its source instead:"
            echo "  docs/usage/mods.md        <- tools/mods.json"
            echo "  docs/usage/quest-book.md  <- tools/gen-quests-boundless.js"
            echo "  docs/usage/keybinds.md    <- tools/gen-keybinds.js"
            echo
            git --no-pager diff -- docs/usage/mods.md docs/usage/quest-book.md docs/usage/keybinds.md README.md modrinth-description.md
            exit 1
          fi
          echo "Docs match the pack."
