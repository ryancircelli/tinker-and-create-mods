name: Build and publish pack

# Publishing happens on MERGE to master, never on a proposal. A pull request is
# checked by pr.yml (build, verify, docs, duplicate-version warning) and only
# once it lands here does anything reach players. master is protected and
# requires a pull request, so a push to it is by definition a merge.
#
# Driven by tools/mods.json: bump pack.version in the pull request, merge, and
# the new version appears on Modrinth. Clients (Modrinth App) and the server
# (mrpack4server) both pick it up on their next check.
on:
  push:
    # master, not main: the repository's default branch is master, so a trigger
    # on main would silently never fire and every version bump would look
    # published while nothing had happened.
    branches: [master]
    paths:
      - 'tools/mods.json'
      - 'tools/build.js'
      # overrides/ IS pack content -- configs, the quest pack, Paxi data packs.
      # Leaving it out meant a change to any of them pushed without publishing,
      # and only shipped later if it happened to coincide with a mods.json edit.
      # Two commits reached master this way and never reached players.
      - 'overrides/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # The repository default for GITHUB_TOKEN is read-only, so creating the
    # release failed with "HTTP 403: Resource not accessible by integration" --
    # and the step's `|| echo` turned that into a success. Grant exactly the one
    # write scope the release step needs, and nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Modrinth does not enforce unique version numbers -- two runs both returned
      # HTTP 200 for 1.7.3 and left two versions with the same number and
      # different files. Rather than just refusing, take the next free patch
      # number so a re-run always publishes something coherent. The publish step
      # keeps a hard guard as a backstop.
      - name: Claim a free version number
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          ID=$(curl -sS -H "Authorization: $TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s); if(!j.id){console.error(s.slice(0,200));process.exit(1);}
                console.log(j.id);})')
          # export, not a plain assignment: the node step below reads it from the
          # environment, and a shell variable would arrive as undefined.
          export TAKEN=$(curl -sS -H "Authorization: $TOKEN" \
            "https://api.modrinth.com/v2/project/$ID/version" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                console.log(((JSON.parse(s))||[]).map(v=>v.version_number).join(" "));})')
          echo "already published: ${TAKEN:-<none>}"
          node -e '
            const fs=require("fs");
            const p="tools/mods.json";
            const d=JSON.parse(fs.readFileSync(p,"utf8"));
            const taken=new Set((process.env.TAKEN||"").split(" ").filter(Boolean));
            const start=d.pack.version;
            if (taken.has(start)) {
              const m=start.match(/^(\d+)\.(\d+)\.(\d+)$/);
              if(!m){console.error(`cannot auto-bump non-semver version ${start}`);process.exit(1);}
              let [,maj,min,pat]=m; pat=Number(pat);
              while (taken.has(`${maj}.${min}.${pat}`)) pat++;
              d.pack.version=`${maj}.${min}.${pat}`;
              fs.writeFileSync(p, JSON.stringify(d,null,2)+"\n");
              console.log(`auto-bumped ${start} -> ${d.pack.version}`);
            } else {
              console.log(`${start} is free; publishing as-is`);
            }
          '

      - name: Read pack version
        id: pack
        run: |
          echo "version=$(node -p "require('./tools/mods.json').pack.version")" >> "$GITHUB_OUTPUT"
          echo "mc=$(node -p "require('./tools/mods.json').pack.minecraft")" >> "$GITHUB_OUTPUT"
          echo "loader=$(node -p "require('./tools/mods.json').pack.loader")" >> "$GITHUB_OUTPUT"

      # Resolves every mod against the Modrinth API and writes the .mrpack.
      # No jars are committed: the three non-Modrinth mods are referenced by
      # GitHub release URL, which is a whitelisted .mrpack download domain.
      # Every run started from an empty cache and paid the full API cost, which
      # is what tripped HTTP 429. Keyed on mods.json so a rebuild of unchanged
      # dependencies restores it wholesale; restore-keys let an edited mods.json
      # still reuse most of the previous cache rather than starting cold.
      - name: Cache Modrinth lookups
        uses: actions/cache@v4
        with:
          path: .cache
          key: modrinth-${{ hashFiles('tools/mods.json') }}
          restore-keys: modrinth-

      - name: Build pack
        # Authenticated so resolution is billed to this account rather than to
        # the shared GitHub runner IP, which hit HTTP 429.
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: node tools/build.js

      - name: Verify the build
        run: |
          PACK="packs/tinker-and-create-${{ steps.pack.outputs.version }}.mrpack"
          test -f "$PACK" || { echo "::error::$PACK not produced"; exit 1; }
          # A pack that embeds jars means an external URL silently failed to
          # resolve and build.js fell back to overrides -- catch that here
          # rather than shipping a 16 MB pack to every client.
          if unzip -Z1 "$PACK" | grep -q '^overrides/.*\.jar$'; then
            echo "::error::pack contains embedded jars; expected all mods to be CDN-referenced"
            exit 1
          fi
          node -e '
            const {execSync}=require("child_process");
            const p=`packs/tinker-and-create-${process.env.V}.mrpack`;
            const idx=JSON.parse(execSync(`unzip -p ${p} modrinth.index.json`,{maxBuffer:1<<26}));
            const bad=idx.files.filter(f=>!f.downloads?.[0]||!f.hashes?.sha1||!f.hashes?.sha512);
            if(bad.length){console.error("::error::files missing downloads/hashes:",bad.length);process.exit(1);}
            console.log(`ok: ${idx.files.length} files, all with downloads + sha1 + sha512`);
          '
        env:
          V: ${{ steps.pack.outputs.version }}

      # Backstop only: "Claim a free version number" should already have moved
      # off any taken number. If this still fires, the two disagree and that is
      # worth failing on rather than publishing a second copy.
      - name: Publish to Modrinth
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ secrets.MODRINTH_PROJECT_ID }}
          V: ${{ steps.pack.outputs.version }}
          MC: ${{ steps.pack.outputs.mc }}
          LOADER: ${{ steps.pack.outputs.loader }}
        run: |
          PACK="packs/tinker-and-create-${V}.mrpack"
          # POST /v2/version needs the base62 project ID, not the slug: passing a
          # slug fails with "Invalid character '-' in base62 encoding". Resolving
          # it here means MODRINTH_PROJECT_ID may hold either form, and an
          # unlisted or in-review project still resolves because this request is
          # authenticated (anonymous lookups of it 404).
          RESOLVED=$(curl -sS -H "Authorization: $TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s);
                if(!j.id){console.error("could not resolve project:",s.slice(0,200));process.exit(1);}
                console.log(j.id);
              })')
          echo "resolved project '$PROJECT' -> $RESOLVED"
          PROJECT="$RESOLVED"

          # Modrinth does NOT enforce unique version numbers -- two runs of this
          # workflow both returned HTTP 200 for 1.7.3 and produced two versions
          # with the same number and different files, which is how a client and a
          # server can end up on different builds of "the same" version. Check
          # first and stop, rather than silently adding another duplicate.
          EXISTING=$(curl -sS -H "Authorization: $TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT/version" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const want=process.env.V;
                const hits=(JSON.parse(s)||[]).filter(v=>v.version_number===want);
                console.log(hits.map(v=>v.id).join(","));
              })')
          if [ -n "$EXISTING" ]; then
            echo "::error::version $V already exists on Modrinth (version id(s): $EXISTING). Bump pack.version in tools/mods.json, or delete the existing version first."
            exit 1
          fi

          DATA=$(node -e '
            console.log(JSON.stringify({
              name: `Tinker & Create ${process.env.V}`,
              version_number: process.env.V,
              game_versions: [process.env.MC],
              version_type: "release",
              loaders: [process.env.LOADER],
              featured: true,
              project_id: process.env.PROJECT,
              dependencies: [],
              file_parts: ["file"],
            }));
          ')
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $TOKEN" \
            -F "data=$DATA;type=application/json" \
            -F "file=@$PACK;type=application/zip")
          echo "HTTP $CODE"; cat /tmp/resp.json; echo
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || { echo "::error::Modrinth publish failed"; exit 1; }

      - name: Attach pack to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.pack.outputs.version }}
        run: |
          # Fallback channel, and what server/fetch-latest-github.sh reads.
          # Check for an existing release explicitly rather than treating ANY
          # failure as "already exists" -- that idiom hid a 403 for every run and
          # reported success while creating nothing.
          if gh release view "pack-v${V}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release pack-v${V} already exists — skipping"
          else
            gh release create "pack-v${V}" "packs/tinker-and-create-${V}.mrpack" \
              --repo "${{ github.repository }}" \
              --title "Pack ${V}" \
              --notes "Manifest-only modpack; all mods download from CDNs."
          fi

      # Regenerate the derived docs from THIS build. CI is the source of truth
      # for anything that depends on the artifact: the jar list records the
      # versions the resolver actually chose, and the resolver run that matters
      # is the one whose output got published. A developer's local build is
      # incidental and may be hours stale -- the first run of the docs workflow
      # failed on exactly that, supplementaries 3.8.8 locally vs 3.8.9 here.
      #
      # docs/usage/{mods,quest-book,keybinds}.md are derived from files in the
      # repository and so are identical either way; shipped-jars.md and the
      # badges are the parts that need the artifact.
      - name: Regenerate docs from the published artifact
        run: node tools/gen-docs.js

      # The published record of exactly which jar versions went out, attached to
      # the release rather than committed. master requires a pull request, so
      # Actions cannot push to it -- and should not: the repository's history
      # should be things people decided, not a bot's echo of them.
      #
      # This file is the one piece of documentation that genuinely cannot be
      # derived from the repository, because it records what the resolver chose
      # at build time. Attaching it to the release ties it to the artifact it
      # describes, permanently and unambiguously.
      - name: Attach the jar manifest to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.pack.outputs.version }}"
          if [ -f docs/usage/shipped-jars.md ]; then
            cp docs/usage/shipped-jars.md "shipped-jars-${V}.md"
            gh release upload "v${V}" "shipped-jars-${V}.md" \
              --repo "${{ github.repository }}" --clobber
            echo "attached shipped-jars-${V}.md to release v${V}"
          fi

      # Persist an auto-bump so the repository matches what was published.
      #
      # Non-fatal by design: master requires a pull request, so this push is
      # expected to be rejected, and the run must not fail for it -- the pack is
      # already on Modrinth by this point and failing here would imply otherwise.
      # The bump only fires as a backstop when the version in the pull request
      # was already published, which the PR check warns about beforehand.
      - name: Commit the bumped version, if the branch allows it
        continue-on-error: true
        run: |
          if git diff --quiet -- tools/mods.json; then
            echo "version unchanged; nothing to commit"
            exit 0
          fi
          V="${{ steps.pack.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/mods.json
          git commit -m "Bump pack version to ${V} (auto)"
          if ! git push origin HEAD:master; then
            echo "::warning::Could not push the version bump (master is protected). Published as ${V}; bump tools/mods.json in your next pull request to match."
          fi
