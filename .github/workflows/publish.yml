name: Build and publish pack

# Publishing is driven by tools/mods.json: bump pack.version, push, and the new
# version appears on Modrinth. Clients (Modrinth App) and the server
# (mrpack4server) both pick it up on their next check.
on:
  push:
    # master, not main: the repository's default branch is master, so a trigger
    # on main would silently never fire and every version bump would look
    # published while nothing had happened.
    branches: [master]
    paths:
      - 'tools/mods.json'
      - 'tools/build.js'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # The repository default for GITHUB_TOKEN is read-only, so creating the
    # release failed with "HTTP 403: Resource not accessible by integration" --
    # and the step's `|| echo` turned that into a success. Grant exactly the one
    # write scope the release step needs, and nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read pack version
        id: pack
        run: |
          echo "version=$(node -p "require('./tools/mods.json').pack.version")" >> "$GITHUB_OUTPUT"
          echo "mc=$(node -p "require('./tools/mods.json').pack.minecraft")" >> "$GITHUB_OUTPUT"
          echo "loader=$(node -p "require('./tools/mods.json').pack.loader")" >> "$GITHUB_OUTPUT"

      # Resolves every mod against the Modrinth API and writes the .mrpack.
      # No jars are committed: the three non-Modrinth mods are referenced by
      # GitHub release URL, which is a whitelisted .mrpack download domain.
      - name: Build pack
        run: node tools/build.js

      - name: Verify the build
        run: |
          PACK="packs/tinker-and-create-${{ steps.pack.outputs.version }}.mrpack"
          test -f "$PACK" || { echo "::error::$PACK not produced"; exit 1; }
          # A pack that embeds jars means an external URL silently failed to
          # resolve and build.js fell back to overrides -- catch that here
          # rather than shipping a 16 MB pack to every client.
          if unzip -Z1 "$PACK" | grep -q '^overrides/.*\.jar$'; then
            echo "::error::pack contains embedded jars; expected all mods to be CDN-referenced"
            exit 1
          fi
          node -e '
            const {execSync}=require("child_process");
            const p=`packs/tinker-and-create-${process.env.V}.mrpack`;
            const idx=JSON.parse(execSync(`unzip -p ${p} modrinth.index.json`,{maxBuffer:1<<26}));
            const bad=idx.files.filter(f=>!f.downloads?.[0]||!f.hashes?.sha1||!f.hashes?.sha512);
            if(bad.length){console.error("::error::files missing downloads/hashes:",bad.length);process.exit(1);}
            console.log(`ok: ${idx.files.length} files, all with downloads + sha1 + sha512`);
          '
        env:
          V: ${{ steps.pack.outputs.version }}

      # Fails loudly if the version already exists on Modrinth, rather than
      # silently doing nothing -- version numbers are immutable there.
      - name: Publish to Modrinth
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ secrets.MODRINTH_PROJECT_ID }}
          V: ${{ steps.pack.outputs.version }}
          MC: ${{ steps.pack.outputs.mc }}
          LOADER: ${{ steps.pack.outputs.loader }}
        run: |
          PACK="packs/tinker-and-create-${V}.mrpack"
          # POST /v2/version needs the base62 project ID, not the slug: passing a
          # slug fails with "Invalid character '-' in base62 encoding". Resolving
          # it here means MODRINTH_PROJECT_ID may hold either form, and an
          # unlisted or in-review project still resolves because this request is
          # authenticated (anonymous lookups of it 404).
          RESOLVED=$(curl -sS -H "Authorization: $TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s);
                if(!j.id){console.error("could not resolve project:",s.slice(0,200));process.exit(1);}
                console.log(j.id);
              })')
          echo "resolved project '$PROJECT' -> $RESOLVED"
          PROJECT="$RESOLVED"
          DATA=$(node -e '
            console.log(JSON.stringify({
              name: `Tinker & Create ${process.env.V}`,
              version_number: process.env.V,
              game_versions: [process.env.MC],
              version_type: "release",
              loaders: [process.env.LOADER],
              featured: true,
              project_id: process.env.PROJECT,
              dependencies: [],
              file_parts: ["file"],
            }));
          ')
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $TOKEN" \
            -F "data=$DATA;type=application/json" \
            -F "file=@$PACK;type=application/zip")
          echo "HTTP $CODE"; cat /tmp/resp.json; echo
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || { echo "::error::Modrinth publish failed"; exit 1; }

      - name: Attach pack to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.pack.outputs.version }}
        run: |
          # Fallback channel, and what server/fetch-latest-github.sh reads.
          # Check for an existing release explicitly rather than treating ANY
          # failure as "already exists" -- that idiom hid a 403 for every run and
          # reported success while creating nothing.
          if gh release view "pack-v${V}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release pack-v${V} already exists — skipping"
          else
            gh release create "pack-v${V}" "packs/tinker-and-create-${V}.mrpack" \
              --repo "${{ github.repository }}" \
              --title "Pack ${V}" \
              --notes "Manifest-only modpack; all mods download from CDNs."
          fi
